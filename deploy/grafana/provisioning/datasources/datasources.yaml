apiVersion: 1

# 紫隊 Grafana 資料源：目前只有 collector 這個 Postgres，
# 沒有 cyber 那條 Loki/Prometheus log/metric pipeline。
datasources:
  - name: Purple Collector Postgres
    uid: purple-pg
    type: postgres
    access: proxy
    url: postgres:5432
    database: collector
    user: collector
    isDefault: true
    jsonData:
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: collector
    editable: false
