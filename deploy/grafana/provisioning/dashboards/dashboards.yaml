apiVersion: 1

providers:
  - name: Purple Collector
    orgId: 1
    folder: Purple Collector
    type: file
    disableDeletion: false
    # provisioned dashboard 唯讀：真相在這個 repo 的 JSON 檔，不在 Grafana
    # 自己的資料庫裡，開放 UI 編輯只會讓兩邊悄悄漂掉。
    editable: false
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
