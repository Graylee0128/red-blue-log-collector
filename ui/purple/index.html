<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Purple Console</title>
<link rel="stylesheet" href="../assets/base.css">
</head>
<body>

<div class="topbar">
  <div>
    <h1>Purple Console</h1>
    <div class="sub" id="subtitle">Loading…</div>
  </div>
  <div class="who">caller <b>purple</b> · sees gaps + raw evidence, not just hits</div>
</div>

<div id="banner" class="banner"></div>

<div class="tabs">
  <div class="tab active" data-screen="coverage">Coverage</div>
  <div class="tab" data-screen="drilldown">Drilldown</div>
  <div class="tab" data-screen="report">Exercise Report</div>
</div>

<!-- Screen 1: coverage table -->
<section id="screen-coverage">
  <div class="panel">
    <div class="panel-title">Techniques observed this session</div>
    <table>
      <thead>
        <tr><th>Technique</th><th>Actions</th><th>Status</th></tr>
      </thead>
      <tbody id="coverage-rows"></tbody>
    </table>
    <div id="coverage-empty"></div>
  </div>

  <div class="panel">
    <div class="panel-title">Core metrics</div>
    <div class="metrics" id="coverage-metrics"></div>
  </div>
</section>

<!-- Screen 2: drilldown -->
<section id="screen-drilldown" hidden>
  <button class="link" id="back-to-coverage">← Back to coverage</button>
  <div class="panel" id="drilldown-panel"></div>
</section>

<!-- Exercise Report -->
<section id="screen-report" hidden>
  <div class="panel">
    <div class="panel-title">Exercise Report</div>
    <div id="report-body"></div>
  </div>
</section>

<script type="module" src="./app.js"></script>
</body>
</html>
