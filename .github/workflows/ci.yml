name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Import check (catches broken wiring before pytest collection)
        run: python -c "from rbcollector.server import app"

      - name: pytest (adapters + analysis)
        run: pytest -v
