name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Import check (catches broken wiring before pytest collection)
        run: python -c "from rbcollector.server import app"

      - name: pytest (adapters + analysis)
        run: pytest -v

  # 打包成 image 給 Metis 拉：main branch 推 :latest 用於開發，git tag 推對應的
  # semver tag（如 v0.1.0）用於正式部署。用內建的 GITHUB_TOKEN 推 GHCR，不用另
  # 外存 Docker Hub 帳密。
  publish-image:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "version=latest" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Verify version consistency (tags only)
        if: steps.version.outputs.is_release == 'true'
        run: |
          TAG_VERSION=${{ steps.version.outputs.version }}
          PYPROJECT_VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          if [[ "$TAG_VERSION" != "v$PYPROJECT_VERSION" ]]; then
            echo "Version mismatch:"
            echo "  git tag:        $TAG_VERSION"
            echo "  pyproject.toml: v$PYPROJECT_VERSION"
            echo ""
            echo "Fix: Update pyproject.toml to version=\"${TAG_VERSION#v}\" before tagging"
            exit 1
          fi
          echo "✓ Version verified: $TAG_VERSION matches pyproject.toml"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (release tag)
        if: steps.version.outputs.is_release == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/graylee0128/red-blue-log-collector:${{ steps.version.outputs.version }}
            ghcr.io/graylee0128/red-blue-log-collector:latest

      - name: Build and push (main branch)
        if: steps.version.outputs.is_release == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/graylee0128/red-blue-log-collector:latest
            ghcr.io/graylee0128/red-blue-log-collector:${{ github.sha }}
