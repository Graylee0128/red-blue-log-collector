services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: collector
      POSTGRES_USER: collector
      POSTGRES_PASSWORD: collector
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collector -d collector"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - collector-db:/var/lib/postgresql/data

  collector:
    build: .
    environment:
      DATABASE_URL: postgresql://collector:collector@postgres:5432/collector
      # Shared bearer token required on POST /ingest/*. Empty/unset = auth
      # disabled (local/dev only). Set this before exposing the port beyond
      # localhost -- see "Exposing to other VMs" in README.md.
      INGEST_TOKEN: ${INGEST_TOKEN:-}
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # 紫隊 Grafana 介面：只接現有 collector Postgres（見 deploy/grafana/provisioning/
  # datasources/datasources.yaml），不含 cyber 那條 Loki/Prometheus log/metric pipeline。
  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # 沒開這兩個，之後有任何頁面想嵌 Grafana 面板都會撞到 cyber 那邊記過的同一個坑：
      # Grafana 預設拒絕被嵌 iframe（X-Frame-Options: deny），且未登入直接
      # 跳登入牆，iframe 裡的使用者連帳密在哪都不知道。
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  collector-db:
