services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: collector
      POSTGRES_USER: collector
      POSTGRES_PASSWORD: collector
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collector -d collector"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - collector-db:/var/lib/postgresql/data

  collector:
    build: .
    environment:
      DATABASE_URL: postgresql://collector:collector@postgres:5432/collector
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # 紫隊 Grafana 介面：只接現有 collector Postgres（見 deploy/grafana/provisioning/
  # datasources/datasources.yaml），不含 cyber 那條 Loki/Prometheus log/metric pipeline。
  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  collector-db:
