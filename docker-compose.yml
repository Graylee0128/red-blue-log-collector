services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: collector
      POSTGRES_USER: collector
      POSTGRES_PASSWORD: collector
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collector -d collector"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - collector-db:/var/lib/postgresql/data

  collector:
    build: .
    environment:
      DATABASE_URL: postgresql://collector:collector@postgres:5432/collector
      # Shared bearer token required on POST /ingest/*. Empty/unset = auth
      # disabled (local/dev only). Set this before exposing the port beyond
      # localhost -- see "Exposing to other VMs" in README.md.
      INGEST_TOKEN: ${INGEST_TOKEN:-}
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Metis deploy/logship.sh 的 rsyslog TCP 收信端（架構 §十一）。Metis 端
  # LOG_SINK 指到這裡。host 514 是特權 port，容器內不用 root/CAP_NET_BIND_SERVICE
  # 也能收——對外綁 514、對內轉 5140，port 映射由 Docker daemon 處理，跟
  # collector 用 8001:8000 同一招。
  syslog-receiver:
    build: .
    command: ["python", "-m", "rbcollector.syslog_receiver"]
    environment:
      DATABASE_URL: postgresql://collector:collector@postgres:5432/collector
      SYSLOG_PORT: "5140"
    ports:
      - "514:5140"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Issue #16: 直接讀 Metis seat log 檔案，迴避 rsyslog 的權限/role/buffering 問題。
  # 根據檔案名自動判斷 team（red-*.cmd / blue-{a,b}-*.cmd），避免 rsyslog 寫死 role
  # 的問題。需要 volume mount /var/log/metis/seat 且容器內使用者需要 adm 群組權限
  # 或等效的讀取存取。
  seat-log-receiver:
    build: .
    command: ["python", "-m", "rbcollector.seat_log_receiver"]
    environment:
      DATABASE_URL: postgresql://collector:collector@postgres:5432/collector
      SEAT_LOG_DIR: "/var/log/metis/seat"
      SEAT_LOG_POLL_INTERVAL: "1"
      LOG_LEVEL: "INFO"
    volumes:
      - /var/log/metis/seat:/var/log/metis/seat:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Issue #22：讀 blue/scoring-engine/checker.py 產生的 leaderboard_<target>.
  # json（藍隊修補進度），一樣是「直接讀 Metis 自己的檔案」模式，不是 API。
  #
  # issue #33 查證過（跟另一個 session 交叉確認）：checker.py 寫檔用
  # out_path = f"leaderboard_{target}.json"，純相對路徑，沒有 --out/--dir
  # 參數，實際落在誰手動執行 auto_watch.sh 當下的工作目錄——auto_watch.sh
  # 本身也沒被接進任何部署流程/systemd unit，這個目錄 100% 取決於操作者
  # 當天怎麼打指令，不是讀程式碼能鎖死的答案。Metis 的
  # blue/scoring-engine/README.md 範例指令都是裸的 `python3 checker.py ...`
  # （不是帶完整路徑），代表文件預期操作者是先 cd 進
  # blue/scoring-engine/ 才執行，這是唯一有文件根據的猜測，也是
  # METIS_BLUE_SCORE_HOST_DIR 預設值的來源。/var/lib/metis/blue-scores
  # 純粹是我們這邊之前自己編的暫定值，Metis repo 裡任何地方都沒出現過。
  #
  # 每次部署前務必跟實際操作 checker.py 的人核對這個目錄，對不上的話這條
  # 資料會整場收不到、且不會報錯（blue_score_receiver.py 對不存在的目錄
  # 只記警告，不會讓服務掛掉）——沒有比對過就假設是對的最容易漏掉。
  blue-score-receiver:
    build: .
    command: ["python", "-m", "rbcollector.blue_score_receiver"]
    environment:
      DATABASE_URL: postgresql://collector:collector@postgres:5432/collector
      BLUE_SCORE_DIR: "/var/lib/metis/blue-scores"
      SEAT_LOG_DIR: "/var/log/metis/seat"
      BLUE_SCORE_POLL_INTERVAL: "5"
      LOG_LEVEL: "INFO"
    volumes:
      - ${METIS_BLUE_SCORE_HOST_DIR:-/var/lib/metis/blue-scores}:/var/lib/metis/blue-scores:ro
      # issue #22 後續：額外讀 seat log 目錄，掃出真的存在的藍隊席位
      # （不受 auto_watch.sh 只監控 blue-a-* 的限制），跟 seat-log-receiver
      # 用同一份唯讀掛載，見 blue_score_receiver.py 的 find_blue_seat_names()。
      - /var/log/metis/seat:/var/log/metis/seat:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Issue #21：啟發式 pivot 偵測，tail red-*.out（跟 seat-log-receiver 同一
  # 個目錄，同一份 volume mount，只是看不同副檔名）。純粹是推論，不是
  # 確認過的攻擊成功事件，見 breach_detector.py 開頭 docstring 的限制說明。
  breach-detector:
    build: .
    command: ["python", "-m", "rbcollector.breach_detector"]
    environment:
      DATABASE_URL: postgresql://collector:collector@postgres:5432/collector
      SEAT_LOG_DIR: "/var/log/metis/seat"
      BREACH_POLL_INTERVAL: "10"
      LOG_LEVEL: "INFO"
    volumes:
      - /var/log/metis/seat:/var/log/metis/seat:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # 紫隊 Grafana 介面：只接現有 collector Postgres（見 deploy/grafana/provisioning/
  # datasources/datasources.yaml），不含 cyber 那條 Loki/Prometheus log/metric pipeline。
  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # 沒開這兩個，之後有任何頁面想嵌 Grafana 面板都會撞到 cyber 那邊記過的同一個坑：
      # Grafana 預設拒絕被嵌 iframe（X-Frame-Options: deny），且未登入直接
      # 跳登入牆，iframe 裡的使用者連帳密在哪都不知道。
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # 獨立的 Battleboard 風格戰況板頁面（跟 8001/ui/purple、/ui/battleboard 那套
  # cyber 沿革的分頁式介面並存，用途不同：這個是給投影/大螢幕看戰況用的，
  # 資料是打 collector 的 /analysis API，不是自己算的）。純靜態頁，沒有後端。
  purple-console:
    image: nginx:1.27-alpine
    volumes:
      - ./ui/purple-console:/usr/share/nginx/html:ro
    ports:
      - "8090:80"
    restart: unless-stopped

volumes:
  collector-db:
