services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: collector
      POSTGRES_USER: collector
      POSTGRES_PASSWORD: collector
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collector -d collector"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - collector-db:/var/lib/postgresql/data

  collector:
    build: .
    environment:
      DATABASE_URL: postgresql://collector:collector@postgres:5432/collector
      # Shared bearer token required on POST /ingest/*. Empty/unset = auth
      # disabled (local/dev only). Set this before exposing the port beyond
      # localhost -- see "Exposing to other VMs" in README.md.
      INGEST_TOKEN: ${INGEST_TOKEN:-}
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Issue #16: 直接讀 Metis seat log 檔案，迴避 rsyslog 的權限/role/buffering 問題。
  # 根據檔案名自動判斷 team（red-*.cmd / blue-{a,b}-*.cmd），避免 rsyslog 寫死 role
  # 的問題。需要 volume mount /var/log/metis/seat 且容器內使用者需要 adm 群組權限
  # 或等效的讀取存取。
  seat-log-receiver:
    build: .
    command: ["python", "-m", "rbcollector.seat_log_receiver"]
    environment:
      DATABASE_URL: postgresql://collector:collector@postgres:5432/collector
      SEAT_LOG_DIR: "/var/log/metis/seat"
      SEAT_LOG_POLL_INTERVAL: "1"
      LOG_LEVEL: "INFO"
    volumes:
      - /var/log/metis/seat:/var/log/metis/seat:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Issue #22：讀 blue/scoring-engine/checker.py 產生的 leaderboard_<target>.
  # json（藍隊修補進度），一樣是「直接讀 Metis 自己的檔案」模式，不是 API。
  #
  # issue #44：這個路徑原本沒有固定慣例，checker.py 用相對路徑寫檔，實際
  # 落在誰手動執行當下的工作目錄，換一台機器/換一個操作習慣就對不上。已經
  # 回報 Metis（se-218/Metis#137），對方在 PR #138 定案：checker.py 預設輸出
  # 目錄改成 /var/log/metis/leaderboard/，且透過新增的 metis-checker@.service
  # systemd unit 自動幫每個藍隊 a 座位起一支，不用再手動執行、也不用再猜
  # 操作者的工作目錄——這是 Metis 官方確認的正式慣例（2026-08-21），不是
  # 我們自己編的暫定值。b 座位（內部網段）刻意不計分，Metis 那邊已確認是
  # 設計如此，不是漏接。
  #
  # 如果本機開發環境不是走 systemd（手動跑 checker.py --out 指到別的地方），
  # 用 METIS_BLUE_SCORE_HOST_DIR 覆寫這個預設值即可。
  blue-score-receiver:
    build: .
    command: ["python", "-m", "rbcollector.blue_score_receiver"]
    environment:
      DATABASE_URL: postgresql://collector:collector@postgres:5432/collector
      BLUE_SCORE_DIR: "/var/log/metis/leaderboard"
      SEAT_LOG_DIR: "/var/log/metis/seat"
      BLUE_SCORE_POLL_INTERVAL: "5"
      LOG_LEVEL: "INFO"
    volumes:
      - ${METIS_BLUE_SCORE_HOST_DIR:-/var/log/metis/leaderboard}:/var/log/metis/leaderboard:ro
      # issue #22 後續：額外讀 seat log 目錄，掃出真的存在的藍隊席位
      # （不受 auto_watch.sh 只監控 blue-a-* 的限制），跟 seat-log-receiver
      # 用同一份唯讀掛載，見 blue_score_receiver.py 的 find_blue_seat_names()。
      - /var/log/metis/seat:/var/log/metis/seat:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Issue #21：啟發式 pivot 偵測，tail red-*.out（跟 seat-log-receiver 同一
  # 個目錄，同一份 volume mount，只是看不同副檔名）。純粹是推論，不是
  # 確認過的攻擊成功事件，見 breach_detector.py 開頭 docstring 的限制說明。
  breach-detector:
    build: .
    command: ["python", "-m", "rbcollector.breach_detector"]
    environment:
      DATABASE_URL: postgresql://collector:collector@postgres:5432/collector
      SEAT_LOG_DIR: "/var/log/metis/seat"
      BREACH_POLL_INTERVAL: "10"
      LOG_LEVEL: "INFO"
    volumes:
      - /var/log/metis/seat:/var/log/metis/seat:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Issue #41：把 se-218/Metis#143 印進 <seat>.out 的 [[METIS_EXIT:N]]
  # 標記還原成時間戳，關聯回 .cmd 那句指令，補上 action_result（一直是
  # "unknown"，因為 cmdlog.sh 本身沒有這個資訊，見 exit_code_receiver.py
  # 開頭 docstring 的完整設計說明跟已知限制）。
  exit-code-receiver:
    build: .
    command: ["python", "-m", "rbcollector.exit_code_receiver"]
    environment:
      DATABASE_URL: postgresql://collector:collector@postgres:5432/collector
      SEAT_LOG_DIR: "/var/log/metis/seat"
      EXIT_CODE_POLL_INTERVAL: "5"
      LOG_LEVEL: "INFO"
    volumes:
      - /var/log/metis/seat:/var/log/metis/seat:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  purple-console:
    image: nginx:1.27-alpine
    volumes:
      - ./ui/purple-console:/usr/share/nginx/html:ro
    ports:
      - "8090:80"
    restart: unless-stopped

volumes:
  collector-db:
